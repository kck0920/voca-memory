[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "macros",
    "serde",
] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
fsrs = "6.6.2"

[profile.wasm-release]
# wasm 은 이득이 크다. 네이티브는 아니다.
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
