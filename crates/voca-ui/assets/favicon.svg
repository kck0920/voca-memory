<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cc8ff" />
      <stop offset="60%" stop-color="#6ef2b0" />
      <stop offset="100%" stop-color="#48db92" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="100%" stop-color="#ffb454" />
    </linearGradient>
  </defs>

  <!-- Dark IC Chip Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0e18" stroke="#2c3150" stroke-width="2"/>
  
  <!-- Inner Circuit Panel -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#171a2b" stroke="#1f2338" stroke-width="1.5"/>

  <!-- Circuit pins on edges -->
  <path d="M2 20h4 M2 32h4 M2 44h4 M58 20h4 M58 32h4 M58 44h4 M20 2v4 M32 2v4 M44 2v4 M20 58v4 M32 58v4 M44 58v4" stroke="#2c3150" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Circuit Traces -->
  <path d="M12 20h8l6 10 M52 20h-8l-6 10 M14 46h10l8-10 M50 46h-10l-8-10" stroke="#5cc8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="12" cy="20" r="1.5" fill="#5cc8ff" opacity="0.6"/>
  <circle cx="52" cy="20" r="1.5" fill="#5cc8ff" opacity="0.6"/>
  <circle cx="14" cy="46" r="1.5" fill="#5cc8ff" opacity="0.6"/>
  <circle cx="50" cy="46" r="1.5" fill="#5cc8ff" opacity="0.6"/>

  <!-- Central Bold Geometric 'V' (Flashcard & Long-Term Memory Stream) -->
  <path d="M16 16 L32 46 L48 16" fill="none" stroke="url(#mint-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>

  <!-- Memory Core (IC Golden Storage) -->
  <rect x="26" y="24" width="12" height="12" rx="2.5" fill="url(#core-grad)" stroke="#ffb454" stroke-width="1.2"/>
  
  <!-- Core microchip pin leads -->
  <path d="M24 28h2 M24 32h2 M38 28h2 M38 32h2 M28 22v2 M32 22v2 M28 36v2 M32 36v2" stroke="#ffb454" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Core inner dot -->
  <circle cx="32" cy="30" r="2" fill="#0d0e18"/>
</svg>
